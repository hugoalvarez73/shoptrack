<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">
    <title>ShopTrack — Universal Production System</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/zxing-js/0.21.3/zxing.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root {
            --bg:#ffffff; --surface:#f4f6f8; --surface2:#e8ecf0; --border:#c8d0da;
            --accent:#e67e00; --accent2:#1d6bc4; --green:#16a34a; --red:#dc2626;
            --purple:#7c3aed; --cyan:#0891b2; --orange:#ea6c00;
            --text:#111827; --muted:#4b5563;
            --fh:'Barlow Condensed',sans-serif;
            --fm:'JetBrains Mono',monospace;
            --fb:'Barlow',sans-serif;
        }
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html,body{height:100%;overflow:hidden}
        body{background:var(--bg);color:var(--text);font-family:var(--fb);display:flex;flex-direction:column}

        /* DEPT SELECT SCREEN */
        #deptScreen{
            position:fixed;inset:0;background:#f4f6f8;z-index:2000;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            padding:20px;overflow-y:auto;
            background-image:radial-gradient(ellipse at 20% 50%, rgba(245,158,11,.06) 0%, transparent 60%),
                             radial-gradient(ellipse at 80% 20%, rgba(59,130,246,.05) 0%, transparent 50%);
        }
        #deptScreen.hidden{display:none}
        .ds-logo{font-family:var(--fh);font-size:42px;font-weight:800;letter-spacing:4px;color:var(--accent);line-height:1}
        .ds-logo span{color:var(--text)}
        .ds-tagline{font-family:var(--fm);font-size:11px;color:var(--muted);letter-spacing:3px;margin:6px 0 32px;text-transform:uppercase}
        .ds-heading{font-family:var(--fh);font-size:16px;font-weight:600;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:16px}
        .dept-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:380px;margin-bottom:20px}
        .dept-btn{
            background:#fff;border:2px solid var(--border);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);
            padding:18px 12px;text-align:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;
        }
        .dept-btn:active{transform:scale(.96)}
        .dept-btn.selected{border-color:var(--accent)}
        .dept-icon{font-size:28px;margin-bottom:6px}
        .dept-label{font-family:var(--fh);font-size:16px;font-weight:700;letter-spacing:1px;color:#111827}
        .dept-count{font-family:var(--fm);font-size:10px;color:#6b7280;margin-top:3px}

        /* Dept Colors */
        .dept-btn[data-dept="Machining"]{--dc:var(--accent2)}
        .dept-btn[data-dept="Fiber"]{--dc:var(--yellow,#fbbf24)}
        .dept-btn[data-dept="Structure Form"]{--dc:var(--green)}
        .dept-btn[data-dept="Blow Mold"]{--dc:var(--purple)}
        .dept-btn[data-dept="Metals"]{--dc:var(--cyan)}
        .dept-btn[data-dept="SMC"]{--dc:var(--orange)}
        .dept-btn[data-dept="MANAGER"]{--dc:var(--accent)}
        .dept-btn:hover,.dept-btn.selected{border-color:var(--dc,var(--accent));box-shadow:0 0 20px -5px var(--dc,var(--accent))}

        .manager-btn{grid-column:1/-1;background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(59,130,246,.05));border-color:rgba(245,158,11,.4)}
        .ds-pin input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:12px;font-family:var(--fm);font-size:16px;outline:none;text-align:center;margin-bottom:8px}
        .btn-enter{width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:8px;font-family:var(--fh);font-size:18px;font-weight:700;cursor:pointer}

        /* MAIN APP UI */
        #mainApp{display:none;flex-direction:column;height:100%}
        .hdr{background:#fff;border-bottom:2px solid var(--border);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
        .app-logo{font-family:var(--fh);font-size:20px;font-weight:800;color:var(--accent)}
        .dept-chip{font-family:var(--fh);font-size:13px;font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid;cursor:pointer}
        .tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);flex-shrink:0}
        .tab{flex:1;padding:10px 4px;text-align:center;font-family:var(--fh);font-size:12px;font-weight:700;color:#6b7280;cursor:pointer;border-bottom:3px solid transparent}
        .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
        .scroll-area{flex:1;overflow-y:auto}
        .page{display:none;padding:14px}
        .page.active{display:block}
        .card{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
        .card-title{font-family:var(--fh);font-size:14px;font-weight:700;letter-spacing:2px;margin-bottom:12px;text-transform:uppercase}
        
        /* Buttons & Forms */
        input, select, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1.5px solid var(--border); margin-bottom: 10px; font-family: inherit; }
        .btn { padding: 12px; border-radius: 8px; border: none; font-family: var(--fh); font-weight: 700; cursor: pointer; text-transform: uppercase; width: 100%; }
        .btn-green { background: var(--green); color: #fff; }
        .btn-accent { background: var(--accent); color: #000; }

        /* Scanner Modal */
        #scannerModal { position: fixed; inset: 0; background: #fff; z-index: 9000; display: none; flex-direction: column; }
        .scan-header { background: #1e3a5f; color: #fff; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .scan-body { padding: 20px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        
        .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:8px;display:none;z-index:10000}
    </style>
</head>
<body>

    <div id="deptScreen">
        <div class="ds-logo">SHOP<span>TRACK</span></div>
        <div class="ds-tagline">Universal Production System</div>
        <div class="ds-heading">Select Your Department</div>
        <div class="dept-grid" id="deptGrid"></div>
        <div class="ds-pin" id="pinArea" style="display:none">
            <input type="password" id="pinInput" maxlength="4" placeholder="Manager PIN">
            <button class="btn-enter" onclick="enterDept()">ENTER →</button>
        </div>
        <div id="noPinArea" style="display:none;width:100%;max-width:380px">
            <button class="btn-enter" onclick="enterDept()">ENTER DEPARTMENT →</button>
        </div>
    </div>

    <div id="mainApp">
        <div class="hdr">
            <div class="app-logo">SHOP<span>TRACK</span></div>
            <div class="dept-chip" id="deptChip" onclick="changeDept()">—</div>
            <div id="hdrTime" style="font-family:monospace">00:00:00</div>
        </div>
        <div class="tabs" id="tabBar"></div>
        <div class="scroll-area">
            <div class="page active" id="tab-scan">
                <div class="card">
                    <div class="card-title">📋 Scan Work Order</div>
                    <button class="btn btn-accent" style="font-size:24px; padding:20px" onclick="openScanner()">📷 OPEN FREE SCANNER</button>
                    <input type="text" id="scanInput" placeholder="Or type Job # here..." style="margin-top:15px; text-align:center">
                </div>
                <div id="woBlock" style="display:none">
                    <div class="card">
                        <div class="card-title">Job Info</div>
                        <label>Job #</label><input id="f_wo" readonly>
                        <label>Part Number</label><input id="f_pn">
                        <label>Description</label><input id="f_pname">
                        <label>Operator</label><input id="f_name" placeholder="Enter your name">
                        <button class="btn btn-green" onclick="startSession()">▶ START JOB</button>
                    </div>
                </div>
            </div>
            </div>
    </div>

    <div id="scannerModal">
        <div class="scan-header">
            <div style="font-weight:800">FREE PHOTO SCANNER</div>
            <button onclick="closeScanner()" style="background:none; border:none; color:#fff; font-size:20px">✕</button>
        </div>
        <div class="scan-body" id="scanState_ready">
            <div style="font-size:50px">📸</div>
            <h3>Take a Photo of the Job Card</h3>
            <p>Make sure the Job # or Barcode is clear</p>
            <input type="file" id="woPhotoInput" accept="image/*" capture="environment" style="display:none" onchange="handleWOPhoto(event)">
            <button class="btn btn-accent" style="margin-top:20px" onclick="document.getElementById('woPhotoInput').click()">TAKE PHOTO</button>
        </div>
        <div class="scan-body" id="scanState_reading" style="display:none">
            <div style="font-size:50px">🔍</div>
            <h3 id="scanReadingMsg">Reading paper (FREE)...</h3>
            <div style="width:80%; height:10px; background:#eee; border-radius:5px; margin-top:20px; overflow:hidden">
                <div id="scanProgress" style="width:0%; height:100%; background:var(--accent); transition:0.3s"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const DEPARTMENTS = [
            { id:'InjectionMold', label:'Injection Mold', icon:'💉', color:'#3b82f6' },
            { id:'Fiber', label:'Fiber', icon:'⚡', color:'#fbbf24' },
            { id:'StructureMold', label:'Structure Mold', icon:'🏗️', color:'#10b981' },
            { id:'BlowMold', label:'Blow Mold', icon:'💨', color:'#8b5cf6' },
            { id:'MANAGER', label:'Manager View', icon:'📊', color:'#f59e0b', pin:'1234' }
        ];

        let activeDept = null;
        let scannedWOData = null;

        function init() {
            const grid = document.getElementById('deptGrid');
            grid.innerHTML = DEPARTMENTS.map(d => `
                <div class="dept-btn" data-dept="${d.id}" onclick="selectDept('${d.id}')">
                    <div class="dept-icon">${d.icon}</div>
                    <div class="dept-label">${d.label}</div>
                </div>
            `).join('');
            
            setInterval(() => {
                document.getElementById('hdrTime').textContent = new Date().toLocaleTimeString();
            }, 1000);
        }

        function selectDept(id) {
            activeDept = DEPARTMENTS.find(d => d.id === id);
            if(activeDept.pin) {
                document.getElementById('pinArea').style.display = 'block';
            } else {
                launchApp();
            }
        }

        function launchApp() {
            document.getElementById('deptScreen').classList.add('hidden');
            document.getElementById('mainApp').style.display = 'flex';
            document.getElementById('deptChip').textContent = activeDept.label;
            document.documentElement.style.setProperty('--accent', activeDept.color);
        }

        function openScanner() {
            document.getElementById('scannerModal').style.display = 'flex';
            showScanState('ready');
        }

        function closeScanner() {
            document.getElementById('scannerModal').style.display = 'none';
        }

        function showScanState(state) {
            document.getElementById('scanState_ready').style.display = state === 'ready' ? 'flex' : 'none';
            document.getElementById('scanState_reading').style.display = state === 'reading' ? 'flex' : 'none';
        }

        async function handleWOPhoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            showScanState('reading');
            document.getElementById('scanProgress').style.width = '30%';

            try {
                const result = await Tesseract.recognize(file, 'eng', {
                    logger: m => {
                        if(m.status === 'recognizing text') {
                            document.getElementById('scanProgress').style.width = (m.progress * 100) + '%';
                        }
                    }
                });

                const text = result.data.text;
                console.log("Scanned Text:", text);

                // Look for Job # pattern (e.g., DS-1234567)
                const woMatch = text.match(/([A-Z]{2,3}-\d{7})/i);
                
                if (woMatch) {
                    const wo = woMatch[0].toUpperCase();
                    document.getElementById('f_wo').value = wo;
                    document.getElementById('scanInput').value = wo;
                    document.getElementById('woBlock').style.display = 'block';
                    closeScanner();
                    toast("Job Found: " + wo);
                } else {
                    alert("Could not find a Job # in the photo. Please try again or type it manually.");
                    showScanState('ready');
                }
            } catch (e) {
                alert("Scanner Error: " + e.message);
                showScanState('ready');
            }
        }

        function startSession() {
            toast("Job Started!");
        }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function changeDept() {
            location.reload();
        }

        init();
    </script>
</body>
</html>
